mutation {
  bulkOperationRunQuery(
    query: """
    {
      orders__QUERY_FILTER__ {
        edges {
          node {
            id
            name
            email
            phone
            createdAt
            updatedAt
            processedAt
            cancelledAt
            cancelReason
            displayFinancialStatus
            displayFulfillmentStatus
            test
            paymentGatewayNames
            totalPriceSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            subtotalPriceSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            totalTaxSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            totalShippingPriceSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            currentTotalAdditionalFeesSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            currentTotalDutiesSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            totalTipReceivedSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            customerJourneySummary {
              ready
              customerOrderIndex
              daysToConversion
              firstVisit {
                id
                occurredAt
                landingPage
                referrerUrl
                source
                sourceDescription
                sourceType
                referralCode
                utmParameters {
                  source
                  medium
                  campaign
                  term
                  content
                }
              }
              lastVisit {
                id
                occurredAt
                landingPage
                referrerUrl
                source
                sourceDescription
                sourceType
                referralCode
                utmParameters {
                  source
                  medium
                  campaign
                  term
                  content
                }
              }
            }
            customer {
              id
              firstName
              lastName
              email
              phone
            }
            lineItems {
              edges {
                node {
                  id
                  title
                  quantity
                  currentQuantity
                  sku
                  originalUnitPriceSet {
                    shopMoney {
                      amount
                      currencyCode
                    }
                  }
                  variant {
                    id
                    title
                    sku
                    price
                  }
                }
              }
            }
            shippingAddress {
              firstName
              lastName
              address1
              address2
              city
              province
              country
              zip
              phone
            }
            billingAddress {
              firstName
              lastName
              address1
              address2
              city
              province
              country
              zip
              phone
            }
            __TRANSACTIONS_PLACEHOLDER__
          }
        }
      }
    }
    """
  ) {
    bulkOperation {
      id
      status
    }
    userErrors {
      field
      message
    }
  }
}
