[project]
name = "ex-shopify-v2"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "freezegun>=1.5.5",
    "keboola-component>=1.6.13",
    "keboola-http-client>=1.0.1",
    "keboola-utils>=1.1.0",
    "mock>=5.2.0",
    "pydantic>=2.11.9",
    "shopifyapi>=12.7.0",
    "requests>=2.31.0",
    "gql>=4.0.0",
    "duckdb>=1.4.0",
    "dateparser>=1.2.2",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "keboola.datadirtest>=2.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.0",
]


[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]

